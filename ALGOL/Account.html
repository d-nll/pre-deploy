<html>
    <head>
        <title>Login or Signup</title>
        <!--ICON-->
        <link rel="icon" href="AN Novel.ico" type="image/x-icon">
        <!--RESPONSIVE-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--FONTS-->

        <!--POPPINS-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

        <!--QUICKSAND-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

        <!--IM FELL ENGLISH-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet"> 

    <body bgcolor="FAF7F0">
        <center>
            <h1><font face="Poppins" size="6">Welcome to Algorithm of Novels</font></h1>

            <form action="/login" method="POST">
                <h3><font face="Quicksand" size="5">Login</font></h3>
                <label for="login-email">Email:</label><br>
                <input type="email" id="login-email" name="login-email" required><br><br>
                <label for="login-password">Password:</label><br>
                <input type="password" id="login-password" name="login-password" required><br><br>
                <input type="submit" value="Log In">
            </form>

            <br>

            <form action="/signup" method="POST">
                <h3><font face="Quicksand" size="5">Sign Up</font></h3>
                <label for="signup-email">Email:</label><br>
                <input type="email" id="signup-email" name="signup-email" required><br><br>
                <label for="signup-password">Password:</label><br>
                <input type="password" id="signup-password" name="signup-password" required><br><br>
                <label for="signup-confirm-password">Confirm Password:</label><br>
                <input type="password" id="signup-confirm-password" name="signup-confirm-password" required><br><br>
                <input type="submit" value="Sign Up">
            </form>
        </center>
    </body>
</html>
